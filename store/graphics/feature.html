<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Play Store feature graphic, 1024x500. Render with make-graphics.py. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif;
    background: linear-gradient(135deg, #0f3d27 0%, #1a5f3f 55%, #2a7f5f 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
  }
  .mark {
    width: 320px;
    height: 320px;
    border-radius: 72px;
    flex-shrink: 0;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .text { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 66px; font-weight: 800; line-height: 1.02; letter-spacing: -1px; }
  .en { font-size: 29px; line-height: 1.3; color: #e6efe9; }
  .ar { font-size: 32px; line-height: 1.4; color: #d4af37; direction: rtl; text-align: right; font-weight: 600; }
  .rule { width: 84px; height: 5px; border-radius: 3px; background: #d4af37; margin: 4px 0; }
  .badge {
    align-self: flex-start;
    background: #d4af37;
    color: #0f3d27;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 999px;
  }
  .badge[hidden] { display: none; }
</style>
</head>
<body>
  <img class="mark" src="../../assets/icon.png" alt="">
  <div class="text">
    <div class="badge" id="badge" hidden>PREMIUM</div>
    <h1>Hajj Proximity</h1>
    <div class="rule"></div>
    <div class="en" id="en">Meeqat and Haram alerts</div>
    <div class="ar" id="ar">تنبيهات المواقيت والحرم</div>
  </div>
<script>
  if (location.hash === '#premium') {
    document.getElementById('badge').hidden = false;
    document.getElementById('en').textContent = 'Plus a Fidyah calculator';
    document.getElementById('ar').textContent = 'مع حاسبة الفدية';
  }
</script>
</body>
</html>
